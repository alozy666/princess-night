<meta charset="utf-8">
<title>ليلة أميرتي</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one night world. A fixed painted scene sits behind a single centred column of dark glass panels; gold hairlines mark what is sealed, rose marks what she can press. */
:root{
  color-scheme:dark;
  --night:#140a1e; --night-2:#22102e; --plum:#3b1a48;
  --rose:#ec4899; --rose-deep:#be185d; --petal:#fbcfe8;
  --gold:#e9c06a; --gold-deep:#b8862f;
  --cream:#fff4ec; --muted:#dcc3d2;
  --glass:rgba(20,10,30,.76); --line:rgba(233,192,106,.34); --hair:rgba(255,244,236,.1);
  --f-display:'Aref Ruqaa','Amiri','Traditional Arabic',serif;
  --f-body:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;min-height:100%;display:flex;flex-direction:column;isolation:isolate}
.scene{position:fixed;inset:0;z-index:-2;background-color:var(--night);background-size:cover;background-position:center}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,30,.66) 0%,rgba(20,10,30,.5) 38%,rgba(20,10,30,.88) 100%)}
#app[data-scene="cover"] .scene{background-image:url(img/cover.jpg),radial-gradient(120% 80% at 80% 0%,#4a1d5c 0%,transparent 60%),radial-gradient(90% 60% at 10% 100%,#7a1746 0%,transparent 65%),linear-gradient(180deg,#1a0c27,#140a1e)}
#app[data-scene="road"] .scene{background-image:url(img/road.jpg),radial-gradient(60% 40% at 50% 100%,#7a1746 0%,transparent 70%),radial-gradient(50% 30% at 50% 45%,#5a3a12 0%,transparent 70%),linear-gradient(180deg,#120a22,#1d0f2e)}
#app[data-scene="dinner"] .scene{background-image:url(img/dinner.jpg),radial-gradient(70% 45% at 50% 85%,#8a3b12 0%,transparent 70%),linear-gradient(180deg,#160b20,#2a1026)}
#app[data-scene="sea"] .scene{background-image:url(img/sea.jpg),radial-gradient(80% 40% at 50% 70%,#1e3a6e 0%,transparent 70%),linear-gradient(180deg,#0e0a24,#131a3a)}
#app[data-scene="home"] .scene{background-image:radial-gradient(70% 45% at 30% 80%,#8a3b12 0%,transparent 70%),radial-gradient(60% 40% at 80% 20%,#5b1a4f 0%,transparent 70%),linear-gradient(180deg,#170b1f,#24102a)}
.aurora{position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 20% 30%,rgba(236,72,153,.2),transparent 70%),radial-gradient(35% 30% at 80% 65%,rgba(233,192,106,.13),transparent 70%),radial-gradient(45% 35% at 60% 10%,rgba(124,58,237,.16),transparent 70%);filter:blur(24px);animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;width:100%;max-width:520px;margin-inline:auto}
.crown{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--gold);display:grid;place-items:center;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.count{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-weight:700;color:var(--petal)}
.tend{display:flex;align-items:center;gap:8px}
.ico{width:24px;height:24px;flex:none}
.view{flex:1;display:flex;flex-direction:column;gap:18px;width:100%;max-width:520px;margin-inline:auto;padding-block:8px 36px}
.view>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.eyebrow{margin:0;color:var(--gold);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1.35;text-wrap:balance;text-shadow:0 2px 18px rgba(20,10,30,.8)}
.h1.big{font-size:44px}
.h2{margin:8px 0 0;font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--petal)}
.lead{margin:0;color:var(--cream);text-shadow:0 1px 12px rgba(20,10,30,.9)}
.fine{margin:0;color:var(--muted);font-size:15px;display:flex;align-items:flex-start;gap:8px}
.fine .ico{width:20px;height:20px;margin-top:4px}
.center{text-align:center;justify-content:center}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:12px}
.card p{margin:0}
.card ol,.card ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.decree{box-shadow:inset 0 0 0 5px rgba(20,10,30,.6),inset 0 0 0 6px var(--line)}
.q{font-family:var(--f-display);font-size:23px;line-height:1.9}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 20px;border-radius:14px;border:1px solid rgba(251,207,232,.35);background:linear-gradient(135deg,var(--rose-deep),#9d174d);color:#fff;font-weight:700;font-size:18px;box-shadow:0 10px 30px rgba(190,24,93,.35);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(20,10,30,.55);border-color:var(--line);color:var(--gold);box-shadow:none}
.btn.small{min-height:46px;font-size:16px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;align-self:center;padding:8px 14px}

/* cover */
.cover{align-items:center;text-align:center;display:flex;flex-direction:column;gap:16px;padding-top:6vh}
.cover .eyebrow{justify-content:center}
.seal{position:relative;width:168px;height:168px;border:0;background:none;padding:0;margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.seal .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.seal .ring circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:352;stroke-dashoffset:352}
.wax{position:absolute;inset:18px;border-radius:47% 53% 50% 50%/52% 48% 52% 48%;background:radial-gradient(circle at 35% 30%,#e04468 0%,#b0153f 45%,#6d0b29 100%);box-shadow:inset 0 -6px 14px rgba(0,0,0,.45),inset 0 5px 10px rgba(255,255,255,.22),0 14px 34px rgba(0,0,0,.55);display:grid;place-items:center;color:#ffd9a8;animation:pulse 2.4s ease-in-out infinite}
.wax .ico{width:58px;height:58px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.seal.broken .wax{animation:crack .5s ease-in forwards}
@keyframes crack{to{transform:scale(1.5) rotate(14deg);opacity:0}}

/* map */
.bouquet{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bouquet .ico{width:30px;height:30px;color:rgba(255,244,236,.28)}
.bouquet .ico.got{color:var(--rose)}
.tiles,.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile,.slot{width:60px;height:68px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1}
.tile{border:1px solid var(--gold);background:rgba(233,192,106,.14);color:var(--gold);padding:0}
button.tile:disabled{opacity:.3}
.slot{border:1px dashed var(--line);background:rgba(20,10,30,.55);color:var(--cream)}
.tile.sm{width:46px;height:52px;font-size:26px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.node{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--hair)}
.node .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold);flex:none}
.node b{display:block;font-size:18px;line-height:1.5}
.node small{display:block;color:var(--muted);font-size:14.5px;line-height:1.5}
.node>div{min-width:0}
.node.done .dot{background:rgba(190,24,93,.35);color:var(--petal);border-color:rgba(251,207,232,.4)}
.node.now{border-color:var(--gold);box-shadow:0 8px 30px rgba(233,192,106,.16)}
.node.locked b{color:var(--muted);font-family:var(--f-display);font-size:22px}

/* riddle */
.tbar{display:flex;align-items:center;gap:12px}
.tbar .track{flex:1;height:8px;border-radius:99px;background:rgba(255,244,236,.14);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transform-origin:right;transition:transform 1s linear}
.tbar span{font-weight:700;color:var(--gold);min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:54px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--glass);text-align:start;font-weight:500;font-size:18px;transition:background .2s,border-color .2s}
.opt.wrong{border-color:#fca5a5;color:#fecaca;opacity:.6;animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.msg{margin:0;min-height:1.8em;color:var(--petal);font-weight:700;text-align:center}

/* scratch reveal */
.scratch{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/5;max-height:54vh;width:100%;background:var(--night-2)}
.art{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:22px;background-size:cover;background-position:center;text-align:center;background-image:radial-gradient(70% 50% at 50% 40%,#6b2360 0%,transparent 70%),linear-gradient(180deg,#22102e,#140a1e)}
.art::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(20,10,30,.9))}
.art>*{position:relative}
.art .ico{width:44px;height:44px;color:var(--gold)}
.art strong{font-family:var(--f-display);font-size:34px;line-height:1.4}
.art[data-img="dinner"]{background-image:url(img/dinner.jpg),radial-gradient(70% 50% at 50% 70%,#8a3b12 0%,transparent 70%),linear-gradient(180deg,#22102e,#140a1e)}
.art[data-img="sea"]{background-image:url(img/sea.jpg),radial-gradient(80% 45% at 50% 65%,#1e3a6e 0%,transparent 70%),linear-gradient(180deg,#131a3a,#0e0a24)}
.art[data-img="home"]{background-image:radial-gradient(70% 50% at 40% 70%,#8a3b12 0%,transparent 70%),linear-gradient(180deg,#24102a,#170b1f)}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

/* road */
.blurred{filter:blur(9px);user-select:none;-webkit-user-select:none;transition:filter .2s}
.blurred.show{filter:none}
#secretBtn{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:112px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:start}
.game .ico{color:var(--gold);width:28px;height:28px}
.game b{font-size:18px;line-height:1.4}
.game small{color:var(--muted);font-size:14.5px;line-height:1.5}

/* arrive */
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;border-radius:90px 90px 14px 14px;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(91,26,79,.85),rgba(20,10,30,.9));color:var(--gold);font-weight:700;font-size:18px;box-shadow:inset 0 0 0 6px rgba(20,10,30,.55)}
.door .ico{width:40px;height:40px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:54px;padding:12px 14px;border-radius:14px;border:1px solid var(--hair);background:var(--glass);text-align:start}
.task .box{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;flex:none;margin-top:3px;color:transparent}
.task .box .ico{width:18px;height:18px}
.task.on .box{background:var(--rose-deep);border-color:var(--petal);color:#fff}
.task.on span:last-child{color:var(--muted);text-decoration:line-through}
.reason{font-family:var(--f-display);font-size:24px;line-height:1.9;color:var(--petal)}

/* final */
.word{font-size:64px;text-align:center;color:var(--petal);text-shadow:0 0 34px rgba(236,72,153,.6)}
.letter p{margin:0}
.sign{font-family:var(--f-display);font-size:22px;color:var(--gold);text-align:end}
.reveal{list-style:none;padding:0!important}
.reveal li{display:flex;gap:10px;align-items:flex-start}
.reveal .ico{width:20px;height:20px;margin-top:6px;color:var(--gold)}

/* modal + panel */
.modal,.panel{position:fixed;inset:0;z-index:20;background:rgba(10,5,16,.78);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#2a1338,#1a0c27);border:1px solid var(--line);border-radius:24px 24px 0 0;padding-top:18px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:rise .32s cubic-bezier(.2,.8,.2,1) both;max-height:100%;overflow-y:auto}
.sheet h2{margin:0;font-family:var(--f-display);font-size:26px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--gold);display:grid;place-items:center;padding:0;flex:none}
.prompt{font-family:var(--f-display);font-size:26px;line-height:1.8;text-align:center;margin:6px 0;text-wrap:balance}
.prog{color:var(--muted);font-size:15px;text-align:center;margin:0}
.event{border:1px solid var(--gold);border-radius:18px;padding:18px;background:rgba(233,192,106,.1);display:flex;flex-direction:column;gap:10px;text-align:center}
.event .eyebrow{justify-content:center}
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{min-height:76px;padding:6px;border-radius:12px;border:1px solid var(--line);background:rgba(20,10,30,.6);font-size:15px;line-height:1.4}
.cell.on{background:var(--rose-deep);border-color:var(--petal);color:#fff;font-weight:700}
.panel{align-items:flex-start}
.panel .sheet{border-radius:0 0 24px 24px;min-height:60%}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.plabel{font-size:15px;color:var(--muted);font-weight:500}
.field input,.field textarea,.prow input[type=text]{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(20,10,30,.7);font-size:17px}
.field textarea{min-height:130px;line-height:1.8;resize:vertical}
.field input:focus,.field textarea:focus,.prow input[type=text]:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 2px rgba(236,72,153,.35)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--hair);background:rgba(20,10,30,.5)}
.prow .phead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.chk input{width:24px;height:24px;accent-color:var(--rose-deep)}
.pbtns{display:flex;gap:6px}
.pb{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--gold);padding:0 10px;font-size:15px;font-weight:700}
.pb:disabled{opacity:.3}
.note{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(233,192,106,.08);font-size:15.5px}
.note p{margin:0}

@media (max-width:360px){.h1{font-size:31px}.h1.big{font-size:38px}.tile,.slot{width:52px;height:60px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app" dir="rtl" lang="ar" data-scene="cover">
  <div class="scene" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <header class="top gut">
    <button class="crown" id="crown" type="button" aria-label="خريطة الليلة"></button>
    <div class="tend">
      <div class="count" id="count" hidden></div>
      <button class="crown" id="snd" type="button" aria-label="إيقاف الموسيقى"></button>
    </div>
  </header>
  <main class="view gut" id="view"></main>
  <div class="modal" id="modal" hidden></div>
  <div class="panel" id="panel" hidden></div>
</div>

 fork:'<path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 3c-2 2-2 6 0 8v10"/>',

 cup:'<path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/>',
 pin:'<path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',

/* ---------- behaviours bound after each render ---------- */
function hold(el,ms,done,prog){
 var iv=null,t0=0,fired=false;
 function stop(){if(iv){clearInterval(iv);iv=null}if(!fired&&prog)prog(0)}
 function start(e){
  if(e.type==='keydown'&&(e.repeat||!(e.key===' '||e.key==='Enter')))return;
  if(iv)return;fired=false;t0=Date.now();
  iv=setInterval(function(){var p=Math.min(1,(Date.now()-t0)/ms);if(prog)prog(p);if(p>=1){fired=true;clearInterval(iv);iv=null;done()}},30);
 }
 el.addEventListener('pointerdown',start);el.addEventListener('keydown',start);
 ['pointerup','pointerleave','pointercancel','keyup','blur'].forEach(function(n){el.addEventListener(n,stop)});
 el.addEventListener('contextmenu',function(e){e.preventDefault()});
}
function after(){
 var seal=$('#seal');
 if(seal){
  var ring=$('#sealRing'),hint=$('#sealHint');
  hold(seal,1300,function(){seal.classList.add('broken');hint.textContent='انكسر الختم';musicOn=true;sealPending=true;sfx('seal',function(){sealPending=false});tryMusic();setTimeout(function(){st.screen='intro';render()},520)},
   function(p){ring.style.strokeDashoffset=String(352*(1-p));if(p>0&&p<1)hint.textContent='لا ترفعي إصبعكِ…';else if(p===0)hint.textContent='اضغطي مطوّلًا على الختم'});
 }
 var sb=$('#secretBtn'),tx=$('#secretTxt');
 if(sb&&tx){
  var on=function(){tx.classList.add('show')},off=function(){tx.classList.remove('show')};
  sb.addEventListener('pointerdown',on);sb.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter')on()});
  ['pointerup','pointerleave','pointercancel','keyup','blur'].forEach(function(n){sb.addEventListener(n,off)});
  sb.addEventListener('contextmenu',function(e){e.preventDefault()});
 }
 if($('#tnum'))startTimer(cur());
 if($('#scratch'))initScratch(cur());
}
function startTimer(id){
 var t=60,num=$('#tnum'),fill=$('#tfill');
 function tick(){
  if(!num.isConnected){clearInterval(tmr);tmr=null;return}
  num.textContent=ar(t);fill.style.transform='scaleX('+(t/60)+')';
  if(t<=0){clearInterval(tmr);tmr=null;st.hint[id]=true;fined=id;render();return}
  t--;
 }
 tick();tmr=setInterval(tick,1000);
}
function initScratch(id){
 var c=$('#scratch'),box=c.parentElement,w=box.clientWidth,h=box.clientHeight,ctx;
 try{ctx=c.getContext('2d')}catch(e){}
 if(!ctx||!w||!h){st.rev[id]=true;render();return}
 var dpr=Math.min(window.devicePixelRatio||1,2);
 c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.scale(dpr,dpr);
 var g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#b8862f');g.addColorStop(.35,'#f3d58a');g.addColorStop(.6,'#c9973c');g.addColorStop(1,'#f0cf7c');
 ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 ctx.fillStyle='rgba(70,36,8,.8)';ctx.textAlign='center';ctx.font='700 20px Tajawal, sans-serif';
 try{ctx.direction='rtl'}catch(e){}
 ctx.fillText('امسحي هنا',w/2,h/2);
 ctx.globalCompositeOperation='destination-out';
 var down=false,moves=0,finished=false;
 function at(e){var r=c.getBoundingClientRect();ctx.beginPath();ctx.arc(e.clientX-r.left,e.clientY-r.top,30,0,Math.PI*2);ctx.fill();if(++moves%6===0)check()}
 function check(){
  if(finished)return;var d;
  try{d=ctx.getImageData(0,0,c.width,c.height).data}catch(e){return}
  var clear=0,tot=0;for(var i=3;i<d.length;i+=4*53){tot++;if(d[i]===0)clear++}
  if(clear/tot>.45){finished=true;st.rev[id]=true;render()}
 }
 c.addEventListener('pointerdown',function(e){down=true;try{c.setPointerCapture(e.pointerId)}catch(x){}at(e)});
 c.addEventListener('pointermove',function(e){if(down)at(e)});
 ['pointerup','pointercancel'].forEach(function(n){c.addEventListener(n,function(){down=false;check()})});
}

 var rows=st.order.concat(ALL.filter(function(x){return st.order.indexOf(x)<0}));
 var live=st.order.filter(function(x){return st.done.indexOf(x)<0});
 var h='<div class="sheet gut" role="dialog" aria-modal="true" aria-labelledby="pTitle"><div class="shead"><h2 id="pTitle">لوحة السائق</h2><button class="x" type="button" data-pact="close" aria-label="إغلاق اللوحة">'+ico('x')+'</button></div>'+
  '<div class="note"><p>تحتاج '+ar(totalRoses())+' وردات: واحدة للانطلاقة وواحدة لكل محطة مفعّلة. الكلمة السرّية: أحبك.</p></div>'+
  '<div class="field"><label for="p-nick">اسمها أو دلعها كما يظهر لها</label><input id="p-nick" type="text" data-pin="nick" value="'+esc(st.nick)+'"></div>'+
  '<div class="field"><label for="p-sign">توقيعك في آخر الرسالة</label><input id="p-sign" type="text" data-pin="sign" value="'+esc(st.sign)+'" placeholder="سائقكِ الليلة وكل ليلة"></div>'+
  '<div class="field"><label for="p-letter">رسالتك داخل الخزنة (اتركها فارغة لتبقى الرسالة الجاهزة)</label><textarea id="p-letter" data-pin="letter">'+esc(st.letter)+'</textarea></div>'+
  '<h2>المحطات</h2><ul class="plist">';
 rows.forEach(function(id){
  var on=st.order.indexOf(id)>=0,done=st.done.indexOf(id)>=0,li=live.indexOf(id);
  h+='<li class="prow"><div class="phead"><label class="chk"><input type="checkbox" id="p-on-'+id+'" data-pact="toggle" data-id="'+id+'"'+(on?' checked':'')+(done?' disabled':'')+'><span>'+ST[id].name+(done?' (اكتملت)':'')+'</span></label>'+
   '<div class="pbtns"><button class="pb" type="button" data-pact="up" data-id="'+id+'" aria-label="تقديم '+ST[id].name+'"'+(li>0?'':' disabled')+'>'+ico('up')+'</button>'+
   '<button class="pb" type="button" data-pact="down" data-id="'+id+'" aria-label="تأخير '+ST[id].name+'"'+(li>=0&&li<live.length-1?'':' disabled')+'>'+ico('down')+'</button>'+
   '<button class="pb" type="button" data-pact="next" data-id="'+id+'"'+(done||li===0?' disabled':'')+'>اجعلها التالية</button></div></div>'+
   '<label class="plabel" for="p-place-'+id+'">اسم المكان الذي يظهر عند الكشف</label><input id="p-place-'+id+'" type="text" data-pin="place" data-id="'+id+'" value="'+esc(st.places[id]||'')+'" placeholder="'+ST[id].name+'"></li>';
 });
 h+='</ul><button class="btn ghost" type="button" data-pact="final">الانتقال إلى الخزنة الآن</button>';
 h+=resetAsk?'<div class="row"><button class="btn small" type="button" data-pact="resetYes">نعم، أعد الليلة من البداية</button><button class="btn small ghost" type="button" data-pact="resetNo">تراجع</button></div>'
  :'<button class="btn ghost" type="button" data-pact="reset">إعادة الليلة من البداية</button>';
 h+='<button class="btn" type="button" data-pact="close">حفظ وإغلاق</button></div>';
 $('#panel').innerHTML=h;
}
function liveIdx(){for(var i=0;i<st.order.length;i++)if(st.done.indexOf(st.order[i])<0)return i;return st.order.length}
function pAct(a,id){
 var i=st.order.indexOf(id),j;
 if(a==='close'){closePanel();return}
 if(a==='up'||a==='down'){
  j=a==='up'?i-1:i+1;
  if(i>=0&&j>=0&&j<st.order.length&&st.done.indexOf(st.order[j])<0){var t=st.order[i];st.order[i]=st.order[j];st.order[j]=t}
 }else if(a==='next'){
  if(i>=0)st.order.splice(i,1);st.order.splice(liveIdx(),0,id);
 }else if(a==='final'){st.screen='final';save();closePanel();return}
 else if(a==='reset'){resetAsk=true}
 else if(a==='resetNo'){resetAsk=false}
 else if(a==='resetYes'){
  var keep={nick:st.nick,sign:st.sign,letter:st.letter,places:st.places,order:st.order};
  st=Object.assign(fresh(),keep);fined=null;vaultTry=[];vaultMsg='';resetAsk=false;save();closePanel();return;
 }
 save();drawPanel();
}

/* ---------- actions ---------- */
function act(a,el){
 var id=cur(),v=el.getAttribute('data-v'),i=parseInt(el.getAttribute('data-i'),10);
 switch(a){
  case 'openRose':st.openRose=true;st.roses=1;nextPiece(st.order.length);sfx('chime');break;
  case 'narrate':
   try{var nr=AUD.decree||(AUD.decree=mk('decree'));
    if(nr.paused){if(bgm)bgm.volume=.2;nr.onended=nr.onpause=function(){if(bgm)bgm.volume=.6};var np=nr.play();if(np&&np.catch)np.catch(function(){})}else nr.pause()}catch(e){}
   return;
  case 'toMap':st.screen='map';break;
  case 'go':st.screen='station';break;
  case 'final':st.screen='final';break;
  case 'answer':
   if(i===ST[id].riddle.a){fined=null;st.ph[id]='reveal';sfx('chime');break}
   el.classList.add('wrong');el.disabled=true;$('#msg').textContent='ليس هذا. اقرئي اللغز ثانيةً.';return;
  case 'hint':st.hint[id]=true;break;
  case 'revealAll':st.rev[id]=true;break;
  case 'depart':st.ph[id]='road';break;
  case 'arrive':st.ph[id]='arrive';break;
  case 'door':st.door[id]=i;break;
  case 'task':if(!st.tasks[id])st.tasks[id]=[];st.tasks[id][i]=!st.tasks[id][i];
   el.classList.toggle('on',!!st.tasks[id][i]);el.setAttribute('aria-pressed',String(!!st.tasks[id][i]));save();return;
  case 'sdone':st.secret[id]=v==='1';break;
  case 'finish':if(st.secret[id]==null)st.secret[id]=false;st.ph[id]='rose';break;
  case 'rose':
   st.rosed[id]=true;st.roses++;sfx('chime');
   st.got[id]=nextPiece(st.order.filter(function(x){return st.done.indexOf(x)<0&&x!==id}).length);break;
  case 'next':st.done.push(id);st.screen=cur()?'map':'final';break;
  case 'tile':
   if(vaultTry.indexOf(i)<0)vaultTry.push(i);vaultMsg='';
   if(vaultTry.length===4){
    var w=vaultTry.map(function(k){return WORD[SHUF[k]]}).join('');
    if(w===WORD){st.vault=true;vaultTry=[];sfx('vault')}
    else{vaultMsg='ليست هذه الكلمة. جرّبي ترتيبًا آخر.';render();setTimeout(function(){if(!st.vault){vaultTry=[];render()}},900);return}
   }
   break;
  case 'vclear':vaultTry=[];vaultMsg='';break;
  case 'game':openGame(el.getAttribute('data-g'));return;
  case 'gclose':closeGame();return;
  case 'evok':G.event=null;drawGame();return;
  case 'again':st.gi[G.id]=0;if(G.id==='who')st.tally={me:0,him:0,both:0};save();drawGame();return;
  case 'who':st.tally[v]=(st.tally[v]||0)+1;advance();return;
  case 'pick':G.pick=parseInt(v,10);drawGame();return;
  case 'adv':advance();return;
  case 'know':if(v==='1'){var q=game('know').deck[st.gi.know||0];st.score[q[0]]++}advance();return;
  case 'cell':st.bingo[i]=!st.bingo[i];if(!st.bingoWon&&bingoLine())st.bingoWon=true;save();drawGame();return;
  default:return;
 }
 render();
}

/* ---------- wiring ---------- */
var held=false;
function boot(data){
 load();
 if(data&&data.st&&typeof data.st==='object')st=Object.assign(fresh(),data.st);
 var crown=$('#crown');crown.innerHTML=ico('crown');
 hold(crown,1200,function(){held=true;openPanel()});
 crown.addEventListener('click',function(){
  if(held){held=false;return}
  if(st.screen!=='cover'&&st.screen!=='intro'){st.screen='map';render()}
 });
 musicOn=st.screen!=='cover';drawSnd();
 $('#snd').addEventListener('click',function(){st.mute=!st.mute;if(st.mute){if(bgm)bgm.pause()}else tryMusic();drawSnd();save()});
 document.addEventListener('pointerup',function(){if(sealPending){sealPending=false;sfx('seal')}tryMusic()},true);
 $('#app').addEventListener('click',function(e){
  var p=e.target.closest('[data-pact]');
  if(p&&p.tagName!=='INPUT'){pAct(p.getAttribute('data-pact'),p.getAttribute('data-id'));return}
  if(e.target===$('#modal')){closeGame();return}
  var el=e.target.closest('[data-act]');if(el)act(el.getAttribute('data-act'),el);
 });
 $('#panel').addEventListener('change',function(e){
  var t=e.target;if(t.getAttribute('data-pact')!=='toggle')return;
  var id=t.getAttribute('data-id'),i=st.order.indexOf(id);
  if(t.checked&&i<0){var h=st.order.indexOf('home');if(h>=0&&st.done.indexOf('home')<0&&id!=='home')st.order.splice(h,0,id);else st.order.push(id)}
  else if(!t.checked&&i>=0)st.order.splice(i,1);
  save();drawPanel();
 });
 $('#panel').addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute('data-pin');if(!k)return;
  if(k==='place')st.places[t.getAttribute('data-id')]=t.value;else st[k]=t.value;
  if(k==='nick'&&!t.value.trim())st.nick='أميرتي';
  save();
 });
 render();
}
window.__night={get st(){return st},openPanel:openPanel,render:render};
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {st:st}})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
